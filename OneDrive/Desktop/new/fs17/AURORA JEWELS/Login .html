<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <title>Login - Aurora Jewels</title>
  <link href="./assert/css/output.css" rel="stylesheet" />
</head>

<body>
  <main>
    <section class="lg:flex">
      <div class="bg-[#650BA6] pb-33 flex-1">
        <h1 class="text-[#D4A1FF] text-[60px] tracking-[12px] pt-33 lg:px-[245.5px] px-[145.5px]">AURORA<br />JEWELS</h1>
        <span class="font-NotoSerif text-[#D4A1FF] text-[24px] pt-4 lg:px-[242.5px] px-[142.5px] pb-8">Jewelry that defines you</span>
        <img src="./assert/imges/Login/Abstract Imagery Component (Editorial Gallery Tile).webp"
          alt="Abstract Imagery Component (Editorial Gallery Tile)" class="rounded-2xl w-md h-140 lg:mx-40 mx-20 pt-8" />
      </div>
      <div class="px-24 bg-[#FFFFFF]">
        <h2 class="font-NotoSerif text-[#1B1B21] text-[30px]  pt-[203.5px]">Welcome Back</h2>
        <p class="text-[#4D4353] text-[16px]  pt-2 pb-12">Enter your details to access your collection.</p>
        <div>
          <label class="text-[#7E7384] text-[12px] tracking-[0.6px] pb-2">EMAIL ADDRESS</label><br />
          <input type="text" placeholder="name@example.com"
            class="text-[16px] text[#6B7280] bg-[#EAE7EF] py-4.5 px-4 w-md h-13.75 rounded-xl">
        </div>
        <div class="py-6">
          <label class="text-[#7E7384] text-[12px] tracking-[0.6px] pb-2 pr-58.75">PASSWORD</label>
          <a href="#" class="text-[#4C0080] text-[12px] tracking-[0.6px]">FORGOT PASSWORD?</a><br />
          <div class="relative">
            <input type="password" placeholder="••••••••"
              class="text-[16px] text[#6B7280] bg-[#EAE7EF] py-4.5 px-4 w-md h-13.75 rounded-xl">
            <img src="./assert/imges/Login/eye icon.svg" alt="eye icon"
              class="absolute top-[21.25px] left-[413.67px]" />
          </div>
        </div>
        <button class="bg-[#4C0080] text-[16px] text-[#FFFFFF] py-4 px-[197.68px] rounded-xl mb-6">Sign
          In</button><br />
        <div class="flex">
          <img src="./assert/imges/Login/line.svg" alt="ine.svg" />
          <a href="#" class="text-[#7E7384] text-[11.2px] tracking-[2.24px] py-6 px-4">OR SIGN IN WITH</a>
          <img src="./assert/imges/Login/line.svg" alt="ine.svg" />
        </div>
        <div class="pt-6 flex pb-12">
          <div class="py-3.5 border border-[#CFC2D5] flex mr-2 rounded-xl">
            <img src="./assert/imges/Login/google icon.svg" alt="google icon" class="pl-[67.09px] pr-3" />
            <a href="#" class="text-[14px] text-[#1B1B21] pr-[67.1px]">Google</a>
          </div>
          <div class="py-3.5 border border-[#CFC2D5] flex rounded-xl">
            <img src="./assert/imges/Login/apple icon.svg" alt="apple icon" class="pl-[71.5px] pr-3" />
            <a href="#" class="text-[14px] text-[#1B1B21] pr-[71.5px]">Apple</a>
          </div>
        </div>
        <div class="pt-8">
          <span class="text-[16px] text-[#4D4353] pr-1 pl-[73.5px]">New to Aurora? </span>
          <a href="#" class="text-[16px] text-[#4C0080] pr-[93.5px]">Create an account</a>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
