<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <title>All Jewelry - Shop</title>
    <link href="./assert/css/output.css" rel="stylesheet" />
</head>

<body>
    <header
        class="bg-headerBackground flex py-6 px-12 gap-[227.01px] mx-auto items-center justify-between sticky top-0">
        <div class="logo">
            <a href="#" class="text-textPrimary font-NotoSerif text-2xl tracking-[2.4px] md:text-[18px]">AURORA
                JEWELS</a>
        </div>
        <nav class="list hidden lg:block">
            <ul class="flex gap-8">
                <li class="text-textSecondary nav-list">
                    <a href="#">Home</a>
                </li>
                <li class="text-textSecondary nav-list">
                    <a href="#">Rings</a>
                </li>
                <li class="text-textSecondary nav-list">
                    <a href="#">Necklaces</a>
                </li>
                <li class="text-textSecondary nav-list">
                    <a href="#">Earrings</a>
                </li>
                <li class="text-textSecondary nav-list">
                    <a href="#">Bracelets</a>
                </li>
                <li class="text-textSecondary nav-list">
                    <a href="#">Collections</a>
                </li>
            </ul>
        </nav>
        <div class="icons hidden xl:block">
            <ul class="flex gap-6">
                <li class="">
                    <a href="#">
                        <img src="./assert/imges/header icons/search icon.svg" alt="search icon" />
                    </a>
                </li>
                <li class="">
                    <a href="#">
                        <img src="./assert/imges/header icons/heart icon.svg" alt="heart icon" />
                    </a>
                </li>
                <li class="">
                    <a href="#">
                        <img src="./assert/imges/header icons/user icon.svg" alt="user icon" />
                    </a>
                </li>
                <li class="">
                    <a href="#">
                        <img src="./assert/imges/header icons/shopping cart icon.svg" alt="shopping cart icon" />
                    </a>
                </li>
            </ul>
        </div>
        <div class="menu block lg:hidden">
            <a href="#"><img src="./assert/imges/header icons/menu Icon.svg" alt="menu Icon" /></a>
        </div>
    </header>
    <main>
        <section class="topNavBar container mx-auto lg:px-12 px-0">
            <div class="pt-12">
                <span class="text-[#4D4353] text-[12px]">HOME > </span>
                <span class="text-[#4C0080] text-[12px]">SHOP</span>
            </div>

            <h1 class="font-NotoSerif text-[56px] pt-2">All Jewelry</h1>
            <span class="text-[#4D4353] text-[16px] pt-2">142 elegant pieces curated for the modern connoisseur</span>
        </section>
    </main>
</body>

</html>
